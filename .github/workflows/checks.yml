name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
      - name: Software tests
        run: python3 -m unittest discover -s tests -q
      - name: Arduino controller-core tests
        run: python3 wokwi/test_controller.py
      - name: Build combined release
        run: python3 scripts/package_release.py
      - name: Verify packaged files
        run: python3 scripts/verify_release.py release/EnergyLine-v1.1.0-final.zip
